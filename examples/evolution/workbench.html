<style>
body{background:radial-gradient(ellipse at 75% 0,#173044 0,transparent 46%),#080e17}main{max-width:1440px}h1{letter-spacing:-1.3px}section,.box{background:#101c2bcc;border-color:#293c50}button:hover{border-color:#80efdc}nav{border-bottom:1px solid #304457;padding-bottom:15px}#workbench{border:1px solid #365368;border-radius:16px;padding:20px;margin:24px 0;background:#0c1623}.studio{display:grid;grid-template-columns:180px minmax(0,1fr) 240px;gap:16px}.studio aside{background:#101e2d;padding:16px;border-radius:10px}.canvases{display:grid;grid-template-columns:1fr 1fr;gap:12px}.canvas{background:linear-gradient(135deg,#101e30,#0c202b);border:1px solid #2b4758;border-radius:12px;overflow:auto}.canvas svg{width:100%;min-width:280px;min-height:300px}#step-slider{width:100%;accent-color:#83ead8}#event-list{max-height:330px;overflow:auto}#event-list button{display:block;font-size:12px;text-align:left;width:100%}#event-detail{font-size:12px}.pill{font-size:11px;letter-spacing:1px;color:#82dacc}.bundlebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#bundle-status{font-size:13px;color:#a2c8d8}.canvas text{font-family:system-ui,sans-serif}#wb-proof{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#wb-trace{font-family:monospace;color:#8aeadb}#workbench select{width:100%;font-size:12px}#workbench h3{font-size:15px}@media(max-width:1050px){.studio{grid-template-columns:1fr}.canvases{grid-template-columns:1fr 1fr}}@media(max-width:650px){.canvases{grid-template-columns:1fr}#workbench{padding:12px}}
</style>
<section id="workbench"><span class="pill">EVOLUTION STUDIO / MODEL · TRACE · EVIDENCE</span><h2>行为演进工作台</h2><p>沿同一条输入历史观察两版模型。状态编号各自独立；连线和当前状态依据实际输入计算，不假定同名状态对应。</p><div class="studio"><aside><h3>对照对象</h3><label>旧版模型<select id="graph-left"></select></label><label>新版模型<select id="graph-right"></select></label><label><input id="directional" type="checkbox"> 模型比较使用定向兼容</label><small>启用后只比较旧操作历史；新版新增操作不参与契约。模型结论不等于真实程序认证。</small></aside><div><div class="canvases"><div class="canvas" id="graph-old"></div><div class="canvas" id="graph-new"></div></div><label>回放步骤 <input id="step-slider" type="range" min="0" max="0" value="0"></label><p id="wb-trace">运行实验或导入数据后查看。</p><small>画布最多显示 24 个状态、96 条边；分析内核仍使用完整模型。曲线与编号是模型结构，不是源码控制流。</small></div><aside><h3>结论与证据范围</h3><p id="wb-proof">尚未运行。</p><h3>实际学习事件</h3><div id="event-list"></div><pre id="event-detail"></pre></aside></div><hr><div class="bundlebar"><button id="bundle-save" disabled>导出完整实验包</button><label>打开实验包 <input type="file" id="bundle-open" accept=".json,application/json"></label><button id="bundle-rerun" disabled>重新运行包内实验</button></div><p id="bundle-status">实验包包含请求、结果、学习事件及来源声明；SHA-256 检查内容一致性，不证明结果真实性。文件在本地读取。</p></section>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.querySelector('.result').before($('workbench'));
const ns='http://www.w3.org/2000/svg';let words=[],replayRequest=null,selectedEvent=null;
const previousShow=show,previousClear=clear;
clear=function(){previousClear();replayRequest=null;selectedEvent=null;['graph-left','graph-right','graph-old','graph-new','event-list','event-detail'].forEach(id=>$(id).replaceChildren());$('bundle-save').disabled=$('bundle-rerun').disabled=true;$('wb-proof').textContent='尚未产生结论。';$('step-slider').max=0;$('wb-trace').textContent='待执行。'};
function svg(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=String(text);return e}
function graph(m,box,title){$(box).replaceChildren();if(!m)return;const s=svg('svg',{viewBox:'0 0 440 350',role:'img','aria-label':title});s.append(svg('text',{x:16,y:25,fill:'#c9e7f1','font-size':14},title));const count=Math.min(m.transitions.length,24),positions=Array.from({length:count},(_,i)=>[220+145*Math.cos(i*2*Math.PI/count),185+125*Math.sin(i*2*Math.PI/count)]);let current=m.initial,path=[],valid=true;const upto=Number($('step-slider').value);for(const input of words.slice(0,upto)){const col=m.alphabet.indexOf(input),edge=m.transitions[current]?.[col];if(!edge){valid=false;break}path.push([current,col]);current=edge.target}let edges=0;for(let i=0;i<count;i++)for(let j=0;j<m.transitions[i].length;j++){if(++edges>96)break;const edge=m.transitions[i][j];if(!positions[edge.target])continue;const [x,y]=positions[i],[a,b]=positions[edge.target],highlight=path.some(([q,c])=>q===i&&c===j);const d=i===edge.target?`M ${x-10} ${y-10} C ${x-65} ${y-70},${x+65} ${y-70},${x+10} ${y-10}`:`M ${x} ${y} Q ${220+(x+a-440)*.18} ${185+(y+b-370)*.18} ${a} ${b}`;const line=svg('path',{d,fill:'none',stroke:highlight?'#81f1d8':'#34566c','stroke-width':highlight?3:1.2});line.append(svg('title',{},`q${i} — ${m.alphabet[j]} / ${edge.output} → q${edge.target}`));s.append(line);if(highlight||count<=4)s.append(svg('text',{x:(x+a)/2,y:(y+b)/2-12,fill:highlight?'#acffe9':'#85a8bc','font-size':10},`${m.alphabet[j]} / ${edge.output}`))}for(let i=0;i<count;i++){const [x,y]=positions[i];s.append(svg('circle',{cx:x,cy:y,r:18,fill:i===current?'#83ecd8':'#142a40',stroke:i===m.initial?'#dbefff':'#47708b','stroke-width':i===m.initial?3:1.5}));s.append(svg('text',{x,y:y+4,'text-anchor':'middle',fill:i===current?'#082b33':'#cee8f3','font-size':11},'q'+i))}if(!valid)s.append(svg('text',{x:14,y:340,fill:'#ffbb8c','font-size':12},'该输入不在模型中，回放停止'));let zoom=1;s.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*(e.deltaY>0?1.1:.9)));s.setAttribute('viewBox',`${220-220*zoom} ${175-175*zoom} ${440*zoom} ${350*zoom}`)},{passive:false});$(box).append(s)}
function redraw(){const l=models[Number($('graph-left').value)]?.[1],r=models[Number($('graph-right').value)]?.[1];graph(l,'graph-old','旧版 / 独立状态编号');graph(r,'graph-new','新版 / 独立状态编号');$('wb-trace').textContent='步骤 '+$('step-slider').value+' / '+words.length+' · '+(words.slice(0,Number($('step-slider').value)).join(' → ')||'初始状态')}
show=function(data,imported=false){previousShow(data,imported);if(data.format==='moonstatelens.directional-analysis')$('verdict').textContent=({ 'compatible-on-old-inputs':'旧操作历史兼容；新增操作历史未认证。','missing-old-operations':'旧操作已删除，旧调用契约不兼容。','changed-old-behavior':'旧操作行为发生变化；模型差异尚需真实回放。' })[data.analysis.status];$('wb-proof').textContent=$('verdict').textContent+'\n'+(imported?'来源：导入文件的声明；未重新执行。':data.format==='moonstatelens.lab'?'来源：实际 MoonLimit 执行；依赖有限状态上界。':'来源：给定模型的精确分析。');for(const id of ['graph-left','graph-right'])models.forEach(([label],i)=>{const o=node('option',label);o.value=i;$(id).append(o)});$('graph-right').value=String(Math.max(0,models.findIndex(([label])=>/guided|right/.test(label))));const difference=data.confirmed_difference??data.difference??data.analysis?.difference;words=Array.isArray(difference?.inputs)?difference.inputs:[];$('step-slider').max=words.length;$('step-slider').value=words.length;redraw();(data.events||[]).slice(0,200).forEach((event,i)=>{const b=node('button',`${i+1} · ${event.kind}`);b.onclick=()=>{selectedEvent=event;$('event-detail').textContent=JSON.stringify(event,null,2);if(event.model)graph(event.model,'graph-new','该轮真实假设模型')};$('event-list').append(b)});$('bundle-save').disabled=false;replayRequest=data.request??(data.format==='moonstatelens.model-analysis'||data.format==='moonstatelens.directional-analysis'?{mode:'models',left:data.left,right:data.right,directional:data.format==='moonstatelens.directional-analysis'}:null);$('bundle-rerun').disabled=!replayRequest;};
for(const id of ['graph-left','graph-right','step-slider'])$(id).oninput=redraw;
$('compare').onclick=()=>act(()=>compute({mode:'models',left:parse($('left').value),right:parse($('right').value),directional:$('directional').checked}));
async function digest(payload){const bytes=new TextEncoder().encode(JSON.stringify(payload));return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('')}
$('bundle-save').onclick=async()=>{try{const payload={request:replayRequest,result,source:{format:'user-visible-source-declaration',engine:'MoonBit compiled from repository source',build:/* BUILD_PROVENANCE */null,exported_at:new Date().toISOString()}};download(JSON.stringify({format:'moonstatelens.experiment-bundle',version:1,payload,sha256:await digest(payload)},null,2),'moonstatelens-experiment.json')}catch(e){$('bundle-status').textContent=e.message}};
$('bundle-open').onchange=async e=>{stop();++serial;clear();try{const file=e.target.files[0];if(!file||file.size>8000000)throw Error('实验包上限 8 MB');const b=JSON.parse(await file.text());if(b.format!=='moonstatelens.experiment-bundle'||b.version!==1||!b.payload?.result||typeof b.sha256!=='string')throw Error('实验包格式不正确');if(await digest(b.payload)!==b.sha256)throw Error('SHA-256 内容校验不一致');const data=b.payload.result;if(data.version!==1||typeof data.format!=='string'||!data.format.startsWith('moonstatelens.'))throw Error('未知结果格式');show(data,true);replayRequest=b.payload.request;if(replayRequest&&!['quota','models'].includes(replayRequest.mode))replayRequest=null;$('bundle-rerun').disabled=!replayRequest;$('wb-proof').textContent+='\nSHA-256 一致，不认证文件中的执行声明。';$('bundle-status').textContent='已恢复实验上下文。包内结果是历史声明；点击重新运行可获得本次证据。'}catch(err){clear();$('bundle-status').textContent='无法打开：'+err.message}};
$('bundle-rerun').onclick=()=>{if(replayRequest)compute(replayRequest)};
});
</script>
