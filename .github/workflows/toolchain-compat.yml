name: Toolchain compatibility
on:
  workflow_dispatch:
    inputs:
      version:
        description: MoonBit compiler/core version to test
        required: true
        default: latest
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@7673f8c9e3725fdbe7a349d881ca07c22044d94d # v1.23
        with:
          version: ${{ inputs.version }}
          core-version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon version --all
      - run: sudo apt-get update
      - run: sudo apt-get install --yes sqlite3
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon run tools/verify_native.mbtx
      - run: moon run tools/verify_artifacts.mbtx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: toolchain-compatibility-evidence
          path: |
            _build/v0.2-evidence/
            _build/artifact-evidence/

