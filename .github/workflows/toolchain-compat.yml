name: Toolchain compatibility
on:
  workflow_dispatch:
    inputs:
      version:
        description: MoonBit compiler/core version to test
        required: true
        default: latest
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: ${{ inputs.version }}
          core-version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon version --all
      - run: sudo apt-get update
      - run: sudo apt-get install --yes sqlite3
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon run tools/verify_native.mbtx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-compatibility-evidence
          path: _build/v0.2-evidence/

