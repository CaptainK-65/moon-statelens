name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon version --all
      - run: moon update
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install SQLite package
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes sqlite3
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        run: choco install sqlite --yes --no-progress
      - run: sqlite3 --version
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon fmt --check
      - run: moon fmt --check tools/verify_cli.mbtx tools/update_evidence.mbtx tools/verify_published.mbtx tools/verify_native.mbtx tools/update_native_interfaces.mbtx
      - run: moon info
      - run: moon run tools/update_native_interfaces.mbtx
      - run: git diff --exit-code -- '*.mbti'
      - run: moon run examples/session
      - run: moon run examples/regression
      - run: moon run examples/lru
      - run: moon run cmd/statelens --target native -- demo regression
      - run: moon run cmd/statelens --target native -- benchmark
      - run: moon run tools/verify_cli.mbtx
      - run: moon run tools/verify_native.mbtx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: _build/v0.2-evidence/
  published-consumer:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: moon run tools/verify_published.mbtx -- ${{ matrix.target }}
