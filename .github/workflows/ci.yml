name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      published_version:
        description: Public package version to independently verify
        required: true
        default: 0.4.0
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PUBLISHED_VERSION: ${{ inputs.published_version || '0.4.0' }}
jobs:
  evolution-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hustcer/setup-moonbit@7673f8c9e3725fdbe7a349d881ca07c22044d94d
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: python -m pip install aalpy==2.0.0 pydot==4.0.1 pyparsing==3.3.3
      - run: moon run tools/verify_evolution.mbtx
      - run: moon run tools/build_evolution_demo.mbtx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evolution-reference
          path: |
            _build/evolution-check-*/
            docs/demo/index.html
  validate:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@7673f8c9e3725fdbe7a349d881ca07c22044d94d # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bootstrap registry before compiling standalone verification scripts
        run: moon update
      - name: Refresh Linux package metadata
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes sqlite3
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        run: choco install sqlite --yes --no-progress
      - name: Verify source and actual components
        run: moon run tools/verify_acceptance.mbtx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        if: always()
        with:
          name: source-evidence-${{ matrix.os }}
          path: |
            _build/acceptance/
            _build/artifact-evidence/
            _build/v0.2-evidence/
            _build/v0.3-evidence/
            _build/v03-consumer-source-*/receipt.json
            _build/v03-consumer-source-*/commands.json
            _build/v03-consumer-source-*/*.log
            _build/evolution-consumer-source-*/receipt.json
            _build/evolution-consumer-source-*/output.log
          retention-days: 30
  published-consumer:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@7673f8c9e3725fdbe7a349d881ca07c22044d94d # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - name: Prepare SQLite
        if: matrix.target == 'native'
        run: sudo apt-get update
      - name: Install SQLite
        if: matrix.target == 'native'
        run: sudo apt-get install --yes sqlite3
      - name: Verify explicit public package version
        run: moon run tools/verify_published.mbtx -- ${{ matrix.target }} ${{ env.PUBLISHED_VERSION }}
      - name: Verify committed standalone consumer against that public version
        if: matrix.target == 'native'
        run: moon run tools/verify_consumer.mbtx -- ${{ env.PUBLISHED_VERSION }}
      - name: Verify all new v0.3 APIs against the actual public package
        if: env.PUBLISHED_VERSION == '0.3.0'
        run: moon run tools/verify_v03_consumer.mbtx -- public ${{ matrix.target }} 0.3.0
      - name: Verify actual public v0.4 evolution APIs and real components
        if: env.PUBLISHED_VERSION == '0.4.0'
        run: moon run tools/verify_evolution_package.mbtx -- public ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.PUBLISHED_VERSION == '0.3.0'
        with:
          name: v03-public-${{ matrix.target }}
          path: |
            _build/v03-consumer-public-*/receipt.json
            _build/v03-consumer-public-*/commands.json
            _build/v03-consumer-public-*/*.log
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.PUBLISHED_VERSION == '0.4.0'
        with:
          name: v04-public-${{ matrix.target }}
          path: |
            _build/evolution-consumer-public-*/receipt.json
            _build/evolution-consumer-public-*/output.log
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.target == 'native'
        with:
          name: public-consumer-evidence
          path: |
            _build/standalone-consumer-*/SUMMARY.md
            _build/standalone-consumer-*/*-evidence/
            _build/standalone-consumer-*/*.log
          retention-days: 30
